<script type="application/ld+json">{"@context":"https://schema.org/","@type":"RealEstateListing","url":"https://www.quintelaepenalva.pt/imovel/apartamento-t3-para-venda-em-alcantara-lisboa/21621572","name":"Apartamento T3 para venda em Alcântara - Lisboa","description":"Apartamento T3 com 177 m2 de área interior e 51 m2 de área exterior para venda em Alcântara, Lisboa- Hyatt Lisboa Residences.\r\n\r\nLocalizado junto ao rio Tejo, em Alcântara, nasce o Hyatt Regency Lisboa. O Hyatt Regency Lisboa é constituído por 97 apartamentos de tipologias T0 a T3, com amplas varandas com vista para o rio Tejo, totalmente mobilados, equipados e decorados.\r\n\r\nPara além da sua excelente localização a um passo de inúmeros locais de interesse, como a Torre de Belém, Lx Factory, Mosteiro dos Jerónimos, o Hyatt Lisboa Residences oferece ainda um bar, piscina e spa.\r\n\r\nAssumindo a marca da luxuosa cadeia de hotéis, o grupo Hyatt está então encarregue pela gestão do empreendimento, que conta com retorno de investimento garantido.\r\n\r\nEste apartamento T3, com 177 m2 de área bruta privativa, é composto por sala e cozinha em open space, três suites, casa de banho e varandas (52 m2). \r\n\r\nAlcântara goza de uma localização privilegiada junto ao Rio Tejo onde podemos encontrar algumas atracões turísticas e culturais tais como o Museu do Oriente e o Museu da Carris. Com uma vasta rede de transportes à disposição, conhecida pelos seus restaurantes e discotecas à beira-rio nos armazéns convertidos das docas de Santo Amaro, junto à ponte 25 de Abril. Próximo de escolas tais como a Escola Secundária Rainha Dona Amélia e do Instituto Superior de Agronomia da Universidade de Lisboa, embaixadas, serviços, farmácias, bancos, zonas de lazer e ciclovias e da Lx Factory, um espaço conhecido pelas suas boutiques, cafés e espaços de arte fora do comum. Com acessos facilitados ao Aeroporto Internacional Humberto Delgado e a 25 minutos da linha de Cascais.\n","primaryImageOfPage":"https://images.egorealestate.com/Z1280x960/OAYES/S5/C16640/P25471574/Tphoto/ID56aa8401-0000-0500-0000-0000140ccdac.jpg","image":"https://images.egorealestate.com/Z1280x960/OAYES/S5/C16640/P25471574/Tphoto/ID56aa8401-0000-0500-0000-0000140ccdac.jpg","mainEntityOfPage":"https://www.quintelaepenalva.pt/imovel/apartamento-t3-para-venda-em-alcantara-lisboa/21621572","about":{"@type":"Accommodation","accommodationCategory":"RESI"},"offers":{"@type":"Offer","price":"2500000","priceCurrency":"EUR","businessFunction":"http://purl.org/goodrelations/v1#Sell","offeredBy":{"@type":"Organization","name":"Quintela + Penalva | Knight Frank"}},"speakable":{"@type":"SpeakableSpecification","xpath":["/html/head/title","//*[@class='specsText']"]}}</script>

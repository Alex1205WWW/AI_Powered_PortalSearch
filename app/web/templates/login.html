{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<article style="max-width: 28rem; margin: 3rem auto">
  <h2>Entrar</h2>
  {% if error %}<p class="errors">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
    <label>Utilizador <input name="username" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Entrar</button>
  </form>
</article>
{% endblock %}
